name: Build Windows free release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'release-version.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the source workflow
        run: python -m unittest discover -s tests -v
      - name: Install the build tool
        run: python -m pip install pyinstaller==6.20.0
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name BeidouPhotoPicker-Free launch.py
      - name: Prepare download and checksums
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath release-version.txt -Raw).Trim()
          $exe = 'dist/BeidouPhotoPicker-Free.exe'
          Copy-Item LICENSE,README.md -Destination dist
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BeidouPhotoPicker-Free.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
          $archive = "BeidouPhotoPicker-Free-v$version-Windows.zip"
          Compress-Archive -LiteralPath $exe,dist/LICENSE,dist/README.md,dist/SHA256SUMS.txt -DestinationPath $archive
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $archive" | Add-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish the free test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath release-version.txt -Raw).Trim()
          gh release create "v$version" "BeidouPhotoPicker-Free-v$version-Windows.zip" dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "v$version 测试版｜摄影师一键选图 · 北斗免费版" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
